<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Clean white background with subtle shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Professional green gradient for primary elements -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B5E20;stop-opacity:1" />
    </linearGradient>
    
    <!-- Premium gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
    
    <!-- Rich brown gradient for barn -->
    <linearGradient id="barnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6D4C41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4E342E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ==========================================
       BACKGROUND - Clean White Circle with Border
       ========================================== -->
  <circle cx="100" cy="100" r="95" fill="#FFFFFF" filter="url(#shadow)" />
  
  <!-- Professional border ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#greenGrad)" stroke-width="4" />
  
  <!-- Inner accent ring - Gold -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />

  <!-- ==========================================
       BARN - Professional Refined Design
       ========================================== -->
  <!-- Barn Body (main structure) -->
  <rect x="58" y="90" width="84" height="65" rx="2" fill="url(#barnGrad)" />
  
  <!-- Barn Roof (cleaner triangle) -->
  <path d="M52 90 L100 52 L148 90 Z" fill="#4E342E" />
  
  <!-- Roof highlight -->
  <path d="M100 52 L148 90 L142 90 L100 58 Z" fill="#3E2723" opacity="0.3" />
  
  <!-- Roof edge trim (gold accent) -->
  <path d="M52 90 L100 52 L148 90" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Barn Door (refined) -->
  <rect x="82" y="108" width="36" height="47" rx="1.5" fill="#3E2723" />
  
  <!-- Door panels -->
  <line x1="100" y1="108" x2="100" y2="155" stroke="#2C1E1A" stroke-width="2" />
  <line x1="82" y1="131" x2="118" y2="131" stroke="#2C1E1A" stroke-width="1.5" />
  
  <!-- Door handles -->
  <circle cx="94" cy="131" r="2" fill="url(#goldGrad)" />
  <circle cx="106" cy="131" r="2" fill="url(#goldGrad)" />
  
  <!-- Barn Windows (professional style) -->
  <rect x="64" y="98" width="12" height="12" rx="1" fill="#FFC107" opacity="0.9" />
  <rect x="124" y="98" width="12" height="12" rx="1" fill="#FFC107" opacity="0.9" />
  
  <!-- Window frames -->
  <rect x="64" y="98" width="12" height="12" rx="1" fill="none" stroke="#4E342E" stroke-width="1.5" />
  <rect x="124" y="98" width="12" height="12" rx="1" fill="none" stroke="#4E342E" stroke-width="1.5" />
  <line x1="70" y1="98" x2="70" y2="110" stroke="#4E342E" stroke-width="1.5" />
  <line x1="64" y1="104" x2="76" y2="104" stroke="#4E342E" stroke-width="1.5" />
  <line x1="130" y1="98" x2="130" y2="110" stroke="#4E342E" stroke-width="1.5" />
  <line x1="124" y1="104" x2="136" y2="104" stroke="#4E342E" stroke-width="1.5" />

  <!-- ==========================================
       SUN - Modern Minimalist Design
       ========================================== -->
  <!-- Sun Body -->
  <circle cx="135" cy="50" r="18" fill="url(#goldGrad)" />
  
  <!-- Sun Rays (refined) -->
  <line x1="135" y1="25" x2="135" y2="32" stroke="#FFC107" stroke-width="3" stroke-linecap="round" />
  <line x1="135" y1="68" x2="135" y2="61" stroke="#FFC107" stroke-width="3" stroke-linecap="round" />
  <line x1="110" y1="50" x2="117" y2="50" stroke="#FFC107" stroke-width="3" stroke-linecap="round" />
  <line x1="160" y1="50" x2="153" y2="50" stroke="#FFC107" stroke-width="3" stroke-linecap="round" />
  
  <!-- Diagonal Rays -->
  <line x1="118" y1="32" x2="124" y2="38" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round" />
  <line x1="152" y1="32" x2="146" y2="38" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round" />
  <line x1="118" y1="68" x2="124" y2="62" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round" />
  <line x1="152" y1="68" x2="146" y2="62" stroke="#FFC107" stroke-width="2.5" stroke-linecap="round" />

  <!-- ==========================================
       PLANT - Refined Green Growth Symbol
       ========================================== -->
  <!-- Main stem -->
  <line x1="75" y1="155" x2="75" y2="130" stroke="url(#greenGrad)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Left leaf (professional curve) -->
  <path d="M75 142 C65 137 60 140 68 145 C72 147 75 144 75 142" fill="url(#greenGrad)" />
  <path d="M75 142 C65 137 60 140 68 145" fill="none" stroke="#1B5E20" stroke-width="1" opacity="0.5" />
  
  <!-- Right leaf (professional curve) -->
  <path d="M75 137 C85 132 90 135 82 140 C78 142 75 139 75 137" fill="url(#greenGrad)" />
  <path d="M75 137 C85 132 90 135 82 140" fill="none" stroke="#1B5E20" stroke-width="1" opacity="0.5" />
  
  <!-- Top leaves -->
  <ellipse cx="75" cy="128" rx="6" ry="8" fill="#2E7D32" />
  <ellipse cx="72" cy="126" rx="4" ry="6" fill="#43A047" />

  <!-- ==========================================
       GROUND LINE - Clean Professional Base
       ========================================== -->
  <line x1="45" y1="160" x2="155" y2="160" stroke="url(#greenGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  
  <!-- Refined grass accents -->
  <path d="M55 160 L57 154 L59 160" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" />
  <path d="M145 160 L147 154 L149 160" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" />
  <path d="M95 160 L97 154 L99 160" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" />
</svg>
