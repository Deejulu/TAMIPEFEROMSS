{% extends "base.html" %}
{% load static %}

{% block title %}Payment Successful - TAMIPEE{% endblock %}

{% block content %}
<div class="container-custom page-wrapper">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-6">
      <div class="card shadow-lg border-0 mx-auto rounded-xl">
        <div class="card-body p-5 text-center">
          <div class="mb-4">
            <div class="rounded-circle bg-success d-flex align-items-center justify-content-center mx-auto dashboard-avatar-ring" style="width: 80px; height: 80px;">
              <i class="bi bi-check-lg text-white"></i>
            </div>
          </div>
          <h3 class="text-primary fw-bold">Payment Successful! 🎉</h3>
          <p class="text-muted">Your payment has been processed successfully.</p>
          <div class="border-top pt-3 mt-3">
            <p class="text-muted small">Transaction ID: #TAM-{{ user.id }}-{{ now|date:"Ymd" }}</p>
          </div>
          <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary mt-3">
            <i class="bi bi-house me-2"></i> Return to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
