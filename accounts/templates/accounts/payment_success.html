{% extends "base.html" %}
{% load static %}

{% block title %}Payment Successful - TAMIPEE{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card shadow-lg border-0 mx-auto" style="max-width: 500px; border-radius: 24px;">
    <div class="card-body p-5">
      <div class="mb-4">
        <div class="rounded-circle bg-success d-flex align-items-center justify-content-center mx-auto" 
             style="width: 80px; height: 80px;">
          <i class="bi bi-check-lg text-white" style="font-size: 40px;"></i>
        </div>
      </div>
      <h3 class="text-dark-green fw-bold">Payment Successful! 🎉</h3>
      <p class="text-muted">Your payment has been processed successfully.</p>
      <div class="border-top pt-3 mt-3">
        <p class="text-muted small">Transaction ID: #TAM-{{ user.id }}-{{ now|date:"Ymd" }}</p>
      </div>
      <a href="{% url 'accounts:dashboard' %}" class="btn btn-success mt-3" 
         style="background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 100%); border: none; border-radius: 12px; padding: 12px 32px;">
        <i class="bi bi-house me-2"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
