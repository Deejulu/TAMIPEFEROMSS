{% load static %}

<div class="sidebar d-flex flex-column" style="
  width: 260px;
  min-height: 100vh;
  background: linear-gradient(180deg, #1B5E20 0%, #0D3B0D 100%);
  color: #FFFFFF;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  z-index: 1000;
  box-shadow: 2px 0 20px rgba(0,0,0,0.1);
">

  <div class="sidebar-brand d-flex align-items-center" style="
    padding: 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    gap: 12px;
  ">
    <img src="{% static 'accounts/images/logo.svg' %}"
         alt="TAMIPEE"
         width="40"
         height="40"
         style="filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));">
    <div>
      <span style="font-size: 20px; font-weight: 700; letter-spacing: 1.5px; display: block; line-height: 1.2;">
        TAMIPEE
      </span>
      <span style="font-size: 11px; color: #D4AF37; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8;">
        Farm Management
      </span>
    </div>
  </div>

  <nav class="nav flex-column" style="padding: 20px 12px; flex: 1;">
    <a href="{% url 'accounts:dashboard' %}" class="nav-link d-flex align-items-center" style="
      padding: 12px 16px;
      color: rgba(255,255,255,0.7);
      border-radius: 12px;
      transition: all 0.3s ease;
      gap: 12px;
      text-decoration: none;
    ">
      <i class="bi bi-grid-3x3-gap-fill" style="font-size: 18px;"></i>
      <span>Dashboard</span>
    </a>

    <a href="#" class="nav-link d-flex align-items-center" style="
      padding: 12px 16px;
      color: rgba(255,255,255,0.7);
      border-radius: 12px;
      transition: all 0.3s ease;
      gap: 12px;
      text-decoration: none;
    ">
      <i class="bi bi-building" style="font-size: 18px;"></i>
      <span>Farm</span>
    </a>

    <a href="#" class="nav-link d-flex align-items-center" style="
      padding: 12px 16px;
      color: rgba(255,255,255,0.7);
      border-radius: 12px;
      transition: all 0.3s ease;
      gap: 12px;
      text-decoration: none;
    ">
      <i class="bi bi-people" style="font-size: 18px;"></i>
      <span>Staff</span>
    </a>

    <a href="#" class="nav-link d-flex align-items-center" style="
      padding: 12px 16px;
      color: rgba(255,255,255,0.7);
      border-radius: 12px;
      transition: all 0.3s ease;
      gap: 12px;
      text-decoration: none;
    ">
      <i class="bi bi-box-seam" style="font-size: 18px;"></i>
      <span>Inventory</span>
    </a>

    <a href="#" class="nav-link d-flex align-items-center" style="
      padding: 12px 16px;
      color: rgba(255,255,255,0.7);
      border-radius: 12px;
      transition: all 0.3s ease;
      gap: 12px;
      text-decoration: none;
    ">
      <i class="bi bi-graph-up" style="font-size: 18px;"></i>
      <span>Reports</span>
    </a>
  </nav>

  <div style="padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
    <div class="d-flex align-items-center" style="gap: 12px;">
      <div class="rounded-circle d-flex align-items-center justify-content-center"
           style="width: 36px; height: 36px; background: #D4AF37; color: #1B5E20; font-weight: 700; font-size: 14px;">
        {{ user.full_name|slice:":1"|upper }}
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
          {{ user.full_name }}
        </div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.6);">
          {{ user.role|default:"Staff" }}
        </div>
      </div>
      <form method="post" action="{% url 'accounts:logout' %}" style="margin: 0;">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm" style="
          color: rgba(255,255,255,0.5);
          padding: 4px 8px;
          transition: all 0.3s ease;
          background: none;
          border: none;
        ">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>
</div>

<style>
  .sidebar .nav-link:hover {
    background: rgba(255,255,255,0.1);
    color: #FFFFFF !important;
  }
  .sidebar .nav-link.active {
    background: #D4AF37;
    color: #1B5E20 !important;
    font-weight: 600;
  }
  .sidebar .nav-link.active i {
    color: #1B5E20 !important;
  }

  .sidebar::-webkit-scrollbar {
    width: 4px;
  }
  .sidebar::-webkit-scrollbar-track {
    background: rgba(255,255,255,0.05);
  }
  .sidebar::-webkit-scrollbar-thumb {
    background: #D4AF37;
    border-radius: 2px;
  }
</style>
